<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/styles/main.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">   
  <title>User Dashboard</title>
</head>
<body>
  <p class="h3 centre panel">Welcome to Quiz Master</p>
  <nav class="navbar md:navbar-expand bg-1">
  <div class="container-fluid">
    <dialog class="drawer drawer-end" tabindex="-1" id="navbarDrawer" aria-labelledby="navbarDrawerLabel">
      <div class="drawer-body mb-2 md:mb-0">
        <ul class="nav navbar-nav me-auto">
          <li class="nav-item">
            <a class="btn-text theme-primary" href="#">Home</a>
          </li>
          <li class="nav-item">
            <a class="btn-text theme-primary" href="#">Quizzes</a>
          </li>
          <li class="nav-item">
            <a class="btn-text theme-primary" href="#">Scores</a>
          </li>
          <li class="nav-item">
            <a class="btn-text theme-primary" href="#">Summary</a>
          </li>
          <li class="nav-item">
            <a class="btn-text theme-primary" href="#">Logout</a>
          </li>
        </ul>
        <form class="hstack gap-2" role="search">
          <input class="form-control" type="search" placeholder="Search" aria-label="Search"/>
          <button class="btn-solid theme-primary" type="submit">
            Search
          </button>
        </form>
        <div class="my-div">Hi, {User}</div>
      </div>
    </dialog>
  </div>
</nav>
  <!-- Upcoming quizzes cards-->
  <div class="card text-center">
    <div class="card-header">
      Upcoming Quizzes
    </div>
    <div class="card-body">
      <table class="centered-table">
      <tr><th>ID</th><th>Chapter</th><th>No.of Questions</th><th>Date</th><th>Duration(hh:min)</th><th>Actions</th></tr>
      <tr><td>1</td><td>Centre of mass</td><td>10</td><td>xx/xx/xxxx</td><td>00:10</td><td>View/Start</td></tr>
       <tr><td>2</td><td>Electro Static Force</td><td>15</td><td>xx/xx/xxxx</td><td>00:15</td><td>View/Start</td></tr>
      </table>
      <a href="#" class="btn-solid theme-primary mx-auto">Go somewhere</a>
    </div>
    <div class="card-footer fg-2">
      All the best!
    </div>
  </div>
  <!--Card end-->

 

</body>
</html>
